<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Tetris — Classic</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="logo">T</span><div><strong>TETRIS</strong><small>CLASSIC EDITION</small></div></div><button id="pauseBtn" class="icon-btn" aria-label="Pause">Ⅱ</button></header>
<section class="game-layout">
<aside class="panel left-panel"><div class="card preview"><h2>NEXT</h2><canvas id="next" width="120" height="100"></canvas></div><div class="card controls"><h2>CONTROLS</h2><p><kbd>←</kbd><kbd>→</kbd> Move</p><p><kbd>↓</kbd> Soft drop</p><p><kbd>↑</kbd> Rotate</p><p><kbd>P</kbd> Pause</p></div></aside>
<section class="board-wrap"><div class="board-frame"><canvas id="board" width="300" height="600"></canvas><div id="overlay" class="overlay"><h1>TETRIS</h1><p id="overlayText">PRESS START</p><button id="startBtn">START</button></div></div></section>
<aside class="panel right-panel"><div class="card stat"><h2>SCORE</h2><strong id="score">000000</strong></div><div class="card stat"><h2>LINES</h2><strong id="lines">000</strong></div><div class="card stat"><h2>LEVEL</h2><strong id="level">00</strong></div><div class="card stat"><h2>HIGH SCORE</h2><strong id="high">000000</strong></div></aside>
</section><footer>CLASSIC RULESET • 10 × 20 • 7 PIECES • LEVEL 0–29</footer>
</main><script src="game.js"></script></body></html>
